<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>💰 Expense Tracker</h1>
            <p>Manage your expenses efficiently</p>
        </header>

        <main>
            <section class="add-expense">
                <h2>Add New Expense</h2>
                <form id="expenseForm">
                    <div class="form-group">
                        <label for="description">Description</label>
                        <input type="text" id="description" placeholder="e.g., Groceries" required>
                    </div>
                    <div class="form-group">
                        <label for="amount">Amount</label>
                        <input type="number" id="amount" placeholder="0.00" step="0.01" required>
                    </div>
                    <div class="form-group">
                        <label for="category">Category</label>
                        <select id="category" required>
                            <option value="">Select a category</option>
                            <option value="Food">Food</option>
                            <option value="Transport">Transport</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Utilities">Utilities</option>
                            <option value="Health">Health</option>
                            <option value="Education">Education</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="date">Date</label>
                        <input type="date" id="date" required>
                    </div>
                    <button type="submit" class="btn-add">Add Expense</button>
                </form>
            </section>

            <section class="summary">
                <h2>Summary</h2>
                <div class="summary-stats">
                    <div class="stat-card">
                        <h3>Total Expenses</h3>
                        <p class="stat-value" id="totalExpenses">$0.00</p>
                    </div>
                    <div class="stat-card">
                        <h3>This Month</h3>
                        <p class="stat-value" id="monthExpenses">$0.00</p>
                    </div>
                    <div class="stat-card">
                        <h3>This Week</h3>
                        <p class="stat-value" id="weekExpenses">$0.00</p>
                    </div>
                </div>
            </section>

            <section class="expenses-list">
                <h2>Expenses</h2>
                <div class="filters">
                    <input type="text" id="filterCategory" placeholder="Filter by category...">
                    <button id="clearAll" class="btn-clear">Clear All</button>
                </div>
                <table class="expenses-table">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Description</th>
                            <th>Category</th>
                            <th>Amount</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="expensesTableBody">
                    </tbody>
                </table>
                <p class="no-expenses" id="noExpenses">No expenses yet. Add one to get started!</p>
            </section>
        </main>

        <footer>
            <p>&copy; 2024 Expense Tracker. All rights reserved.</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
